name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: false
        default: 'production'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Hostinger via LFTP
        run: |
          which lftp || sudo apt-get install -y lftp || (sudo apt-get update && sudo apt-get install -y lftp)
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ftp:ssl-protect-list true;
          set ftp:passive-mode true;
          set ssl:verify-certificate false;
          set ftp:use-site-utime true;
          set net:timeout 15;
          set net:max-retries 2;
          set net:reconnect-interval-base 2;
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://${{ secrets.FTP_HOST }}:21;
          mirror --reverse --only-newer --ignore-time --parallel=5 --verbose ./dist/ ./;
          "

